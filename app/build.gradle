apply plugin: 'com.android.application'

android {
    namespace 'com.openthinks.onnx.example'
    compileSdk 34

    defaultConfig {
        applicationId 'com.openthinks.onnx.example'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // 只保留真机(arm64)与模拟器(x86_64)需要的 ABI，避免 APK 超过 100MB
        ndk {
//            abiFilters 'arm64-v8a', 'x86_64'
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// 产物重命名：debug 与 release 统一叫 yolo26-onnx-example.apk（两者在不同目录，互不冲突）。
// 说明：AGP 8.9 的新变体 API（com.android.build.api.variant.VariantOutput）只能改 versionCode/versionName，
//       没有 outputFileName 入口，因此只能用 legacy 的 applicationVariants；该 API 在 AGP 9 会被移除，
//       升级 AGP 时需重新评估（届时可退化为构建后改名任务或由 CI 改名）。
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = 'yolo26-onnx-example.apk' }
}

// 单元测试跑在 JVM 上，必须排除 android aar（其自带 native 库不能在 JVM 加载），
// 改用同版本 onnxruntime 主机版 jar，二者 java API 完全一致。
configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime-android'
}

// 单元测试工作目录设为仓库根目录，便于按相对路径读取 app/src/main/assets/yolo26_barrier.onnx
tasks.withType(Test).configureEach {
    workingDir = rootProject.projectDir
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0'
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.26.0'
    testImplementation 'junit:junit:4.13.2'
}
